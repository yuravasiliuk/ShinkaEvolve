
#   shinka_run --task-dir examples/tsp_problem --results_dir results/tsp_problem \
#     --num_generations 5 --config-fname config.yaml \
#     --max-proposal-jobs 1 --max-evaluation-jobs 1

# shinka_run requires --num_generations on the command line and not config gile
# Anything set here can still be overridden per-run with --set evo.field=value
# (the CLI --set flags always win over this file).

# in .env -> OPENROUTER_API_KEY: "API_KEY"

evo:
  task_sys_msg: |
    You are an expert Python programmer improving a heuristic solver for the
    Traveling Salesman Problem (TSP).

    You may only modify the code inside `solve_tsp`, between the
    `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END` markers. Code outside
    that block is fixed and must not be changed.

    Function signature:
        def solve_tsp(dist_matrix: list[list[float]]) -> tuple[list[int], float]

    Input:
    - `dist_matrix`: an n x n distance matrix (list of lists of floats).
      `dist_matrix[i][j]` is the distance between city `i` and city `j`.
      Cities are identified by their index, from 0 to n-1.

    Output, a tuple `(tour, total_distance)`:
    - `tour`: a list of city indices giving the order in which cities are
      visited, describing a CLOSED tour:
        * it must start and end with the SAME city, i.e. `tour[0] == tour[-1]`
          (the salesman returns to the city they started from);
        * every city from 0 to n-1 must appear exactly once elsewhere in the
          list — none skipped, none visited twice. So for n cities,
          `len(tour) == n + 1`.
    - `total_distance`: the float length of that closed tour — the sum of
      `dist_matrix[tour[i]][tour[i+1]]` over consecutive cities in `tour`,
      including the final leg back to the starting city.

    A tour that violates this format (wrong start/end city, or a city
    skipped/duplicated) is rejected as invalid and scores 0 for that run,
    no matter how short `total_distance` claims to be — getting the tour
    structure right comes first.

    A tour must be within 5% of the known shortest tour length for that city
    set to be scored at all. Anything farther from optimal than that is
    rejected and scores 0 for that run, same as a malformed tour. Inside that
    5% window you do NOT need to be exactly optimal — being closer to
    optimal scores higher, so there is room for heuristics that reliably get
    close without proving optimality (genetic algorithms, simulated
    annealing, Or-opt, etc.), not just ones that guarantee the exact optimum.

    How `combined_score` (maximized) is computed per test city set, once the
    tour is valid:
    - `distance_penalty`: penalizes `total_distance` for being above the
      known optimal — 0 at exactly optimal, scaling up to 1 right at the 5%
      cutoff.
    - `efficiency_penalty`: penalizes `solve_tsp` being much slower than a
      simple nearest-neighbor greedy baseline on the same input.
    - `complexity_penalty`: penalizes runtime that scales worse than
      roughly O(n) in the number of cities.
    - combined_score = 1 - (0.5 * distance_penalty + 0.15 * efficiency_penalty
      + 0.35 * complexity_penalty)

    Test city sets range from 5 to 2000 cities. Exact optimal-TSP algorithms
    (brute force, Held-Karp) always reach the optimal tour but are far too
    slow past a handful of cities. Local search (nearest neighbor, greedy
    edge, 2-opt / or-opt) reliably lands exactly on optimum for these city
    sets, which maximizes distance_penalty but still costs on speed —
    approaches that trade a little tour quality for a lot of speed (or vice
    versa) are worth exploring too, since distance, efficiency, and
    complexity all trade off in the score.

    In short: get within 5% of optimal to be scored at all, then the score
    rewards being closer to optimal AND running fast, both in absolute terms
    and in how runtime scales with the number of cities.
  llm_models: ["openrouter/deepseek/deepseek-chat"]
  # llm_models: ["openrouter/deepseek/deepseek-r1"]  # 404: no OpenRouter callers via /v1/responses for this account
  # llm_models: ["headless/claude?effort=low"]

  embedding_model: "openrouter/openai/text-embedding-3-small"
  # embedding_model: null,

  # diff  = SEARCH/REPLACE-style targeted edit to the parent program
  # full  = rewrite the whole EVOLVE-BLOCK from scratch
  # cross = combine two parent/inspiration programs
  # Probabilities must sum to 1.0.
  # Weighted toward full/cross (vs. the old 0.6/0.3/0.1) so runs explore
  # genuinely different algorithms more often instead of only refining
  # whichever approach first reached a passing score via incremental diffs.
  patch_types: ["diff", "full", "cross"]
  patch_type_probs: [0.35, 0.45, 0.2]

  # If program fails, how many times to retry
  max_patch_resamples: 3
  max_api_costs: 10
  code_embed_sim_threshold: 0.95

db:
  num_islands: 2

  # How many of the best-ever programs are kept as "elite" long-term
  archive_size: 40

job:
  # Safety net for the 2000-city case: a bad exponential solve_tsp would
  # otherwise hang the eval forever instead of just scoring badly.
  time: "00:05:00"
